name: Deploy Frontend to S3 + CloudFront

on:
  pull_request:
    types: [closed]
    branches:
      - develop

jobs:
  deploy:
    # PR이 실제로 merge된 경우에만 실행 (그냥 닫힌 경우는 제외)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: S3에 업로드
        run: aws s3 sync ./dist s3://aice-edu-frontend --delete

      - name: CloudFront 캐시 무효화
        run: aws cloudfront create-invalidation --distribution-id E39HDZ9B2CQP6M --paths "/*"
